<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hate Speech Detection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="bg"></div>

    <!-- Dark mode toggle -->
    <div class="theme-switch">
        <input type="checkbox" id="darkToggle" onclick="toggleDark()">
        <label for="darkToggle" class="switch">
            <span class="icon">☀️</span>
            <span class="icon">🌙</span>
        </label>
    </div>

    <!-- Main -->
    <div class="wrapper">

        <!-- Input Card -->
        <div class="card">
            <div class="card-header">
                🛡 Hate Speech Detection
            </div>

            <div class="card-body">
                <textarea id="inputText" placeholder="Type or paste text to analyze..."></textarea>
                <button class="btn" onclick="detectHate()">Analyze Text</button>
            </div>
        </div>

        <!-- Loader -->
        <div class="loader" id="loader"></div>

        <!-- Result Card -->
        <div class="card result-card" id="resultCard">
            <div class="card-header success">
                📊 Analysis Result
            </div>

            <div class="card-body">
                <div class="stat">
                    <span>Prediction</span>
                    <h3 id="prediction">-</h3>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
